<div class="mx-auto max-w-2xl p-6">
  <a [routerLink]="['/kanbans', kanbanCode]" class="mb-4 inline-flex items-center gap-1 text-sm text-text-muted hover:text-text-soft">
    ← Retour au tableau
  </a>

  <h1 class="mb-6 text-xl font-semibold text-text">Paramètres du tableau</h1>

  @if (error()) {
    <p class="mb-4 rounded-md bg-danger-soft px-3 py-2 text-sm text-danger">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="text-sm text-text-muted">Chargement...</p>
  } @else {
    <div class="rounded-xl border border-border bg-surface shadow-sm">
      @for (column of columns(); track column.id; let i = $index) {
        <div class="flex items-center gap-2 border-b border-border px-4 py-3 last:border-b-0">
          <label for="column-name-{{ column.id }}" class="sr-only">Nom de la colonne</label>
          <input
            id="column-name-{{ column.id }}"
            type="text"
            class="min-w-0 flex-1 rounded-md border border-border-strong px-2.5 py-1.5 text-sm text-text focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand"
            [value]="column.name"
            [disabled]="saving()"
            (change)="rename(column, $any($event.target).value)"
          />
          <button
            type="button"
            class="rounded-md border border-border-strong px-2 py-1.5 text-xs text-text-muted hover:bg-surface-alt disabled:cursor-not-allowed disabled:opacity-40"
            [disabled]="i === 0 || saving()"
            title="Déplacer à gauche"
            (click)="move(i, -1)"
          >
            ◀
          </button>
          <button
            type="button"
            class="rounded-md border border-border-strong px-2 py-1.5 text-xs text-text-muted hover:bg-surface-alt disabled:cursor-not-allowed disabled:opacity-40"
            [disabled]="i === columns().length - 1 || saving()"
            title="Déplacer à droite"
            (click)="move(i, 1)"
          >
            ▶
          </button>
          <button
            type="button"
            class="rounded-md px-2.5 py-1.5 text-xs font-medium text-danger hover:bg-danger-soft disabled:cursor-not-allowed disabled:opacity-40"
            [disabled]="saving()"
            title="Supprimer la colonne"
            (click)="remove(column)"
          >
            Supprimer
          </button>
        </div>
      }

      <div class="flex items-center gap-2 px-4 py-3">
        <label for="new-column-name" class="sr-only">Nom de la nouvelle colonne</label>
        <input
          id="new-column-name"
          type="text"
          class="min-w-0 flex-1 rounded-md border border-border-strong px-2.5 py-1.5 text-sm text-text focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand"
          placeholder="Nom de la nouvelle colonne"
          [value]="newColumnName()"
          (input)="newColumnName.set($any($event.target).value)"
          (keyup.enter)="addColumn()"
        />
        <button
          type="button"
          class="shrink-0 rounded-md bg-brand px-3 py-1.5 text-sm font-medium text-white hover:bg-brand-hover disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="!newColumnName().trim() || saving()"
          (click)="addColumn()"
        >
          + Ajouter
        </button>
      </div>
    </div>
  }
</div>
